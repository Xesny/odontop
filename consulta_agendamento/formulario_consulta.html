<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Agendamentos</title>
    <link rel="stylesheet" href="formulario.css"> 
</head>
<body>
    <div class="form-container">
        <h2>Consultar Agendamentos</h2>
        <!-- Formulário que envia os dados para consultar_agendamentos.php -->
        <form action="consultar_agendamentos.php" method="GET">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="XXX.XXX.XXX-XX">

            <button type="submit">Consultar</button>
        </form>
    </div>
</body>
</html>
