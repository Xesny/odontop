<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Agendamento</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <div class="form-container">
        <h2>Formulário de Agendamento</h2>
        <form action="processar_formulario.php" method="POST">

           
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

           
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="XXX.XXX.XXX-XX">

           
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

         
            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(XX) XXXX-XXXX">

      
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco" required>

            
            <label for="data_exame">Data do Exame:</label>
            <input type="date" id="data_exame" name="data_exame" required>

            <
            <button type="submit">Agendar Exame</button>
        </form>
    </div>
</body>
</html>
